<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <!-- 上述3个meta标签*必须*放在最前面，任何其他内容都*必须*跟随其后！ -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
        <title>营养家</title>
        <link rel="icon" href="../images/favico.ico">
        <!--不同屏幕尺寸根字体设置-->
        <script src="../js/base.js"></script>
        <!--element-ui的样式-->
        <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css" />
        <!--引入vant样式-->
        <link rel="stylesheet" href="../styles/vant.min.css"/>
        <!-- 引入样式  -->
        <link rel="stylesheet" href="../styles/index.css" />
        <!--本页面内容的样式-->
        <link rel="stylesheet" href="../styles/login.css" />
    </head>
    <body>
        <div id="login" v-loading="loading">
            <div class="divHead">登录</div>
            <div class="divContainer">
                <el-input placeholder=" 请输入邮箱" v-model="form.phone"  maxlength='40'/></el-input>
                <div class="divSplit"></div>
                <el-input placeholder=" 请输入验证码" v-model="form.code"  maxlength='20'/></el-input>
                <!-- 在 span 标签上使用 v-on 指令绑定点击事件和动态样式 -->
                <span ref="getCodeSpan" @click="getCode" :class="{ 'disabled': disableButton, 'grey-color': disableButton }">
                    {{ disableButton ? `获取验证码 (${countDown}s)` : '获取验证码' }}
                </span>
            </div>
            <div class="divMsg" v-if="msgFlag">邮箱不合法,请输入正确的邮箱</div>
            <el-button type="primary" :class="{btnSubmit:1===1,btnNoPhone:!form.phone,btnPhone:form.phone}" @click="btnLogin">登录</el-button>
        </div>
        <!-- 开发环境版本，包含了有帮助的命令行警告 -->
        <script src="../../backend/plugins/vue/vue.js"></script>
        <!-- 引入组件库 -->
        <script src="../../backend/plugins/element-ui/index.js"></script>
        <!-- 引入vant样式 -->
        <script src="../js/vant.min.js"></script>
        <!-- 引入axios -->
        <script src="../../backend/plugins/axios/axios.min.js"></script>
        <script src="../js/request.js"></script>
        <script src="../api/login.js"></script>
    </body>
    <script>
        new Vue({
            el:"#login",
            data(){
                return {
                    form:{
                        phone:'',
                        code:''
                    },
                    msgFlag:false,
                    loading:false,
                    disableButton: false,  // 初始状态为可点击
                    countDown: 0,  // 初始化为0
                }
            },
            computed:{},
            created(){},
            mounted(){},
            methods:{
                async getCode() {
                    // 如果按钮被禁用，直接返回
                    if (this.disableButton) {
                        return;
                    }

                    this.form.code = '';
                    const emailRegex = /^\w+(-+.\w+)*@\w+(-.\w+)*.\w+(-.\w+)*$/;

                    if (emailRegex.test(this.form.phone)) {
                        this.msgFlag = false;
                        // 设置5秒倒计时
                        this.countDown = 5;
                        const timer = setInterval(() => {
                            this.countDown--;
                            if (this.countDown <= 0) {
                                clearInterval(timer);
                                // 启用按钮
                                this.disableButton = false;
                            }
                        }, 1000);

                        // 禁用按钮
                        this.disableButton = true;

                        try {
                            // 发送获取验证码请求
                            const res = await sendMsgApi({ phone: this.form.phone });
                            // 提示框：验证码已发送
                            if(res.code === 1){
                                const message = '验证码已发送，请查收邮箱';
                                this.$notify({ type:'success', message: message});

                            } else {
                                // 提示框：获取验证码失败
                                const message = '获取验证码失败，请稍后重试';
                                this.$notify({ type:'warning', message: message});

                                // 启用按钮
                                this.disableButton = false;
                            }
                        } catch (error) {
                            // 提示框：获取验证码失败
                            this.$notify({ type:'warning', message: error.message});

                            // 启用按钮
                            this.disableButton = false;
                        }

                    } else {
                        this.msgFlag = true;
                        // 启用按钮
                        this.disableButton = false;
                    }
                },
                async btnLogin(){
                    if(this.form.phone && this.form.code){
                        this.loading = true
                        const res = await loginApi(this.form)
                        this.loading = false
                        if(res.code === 1){
                            sessionStorage.setItem("userPhone",this.form.phone)
                            window.requestAnimationFrame(()=>{
                                window.location.href= '../index.html'
                            })
                        }else{
                            this.$notify({ type:'warning', message:res.msg});
                        }
                    }else{
                        this.$notify({ type:'warning', message:'请输入验证码'});
                    }
                }
            }
        })
    </script>
</html>
